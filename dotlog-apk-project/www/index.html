<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="tc" content="#EEF2F4">
<meta name="mobile-web-app-capable" content="yes">
<title>Dotlog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
try{var s=JSON.parse(localStorage.getItem('dotlog.v1')||'{}').settings||{};var t=s.theme||'auto';
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light'}catch(e){}
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{
  --paper:#EEF2F4;--surface:#FFFFFF;--ink:#14213D;--soft:#566575;--faint:#8794A1;
  --dot:#C6D0D7;--line:#D8E0E6;--pen:#1F4BD8;--penbg:#E3EAFE;--marker:#FFD84D;--hl:#FFD84D;
  --danger:#C93A22;--shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.08);
  --nav:66px;--r:16px;
  --serif:Charter,'Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'SamsungOne','Helvetica Neue',sans-serif;
}
:root[data-theme=dark]{
  --paper:#0E131A;--surface:#17202B;--ink:#E7EDF4;--soft:#9AA9B8;--faint:#6B7A89;
  --dot:#222D39;--line:#263341;--pen:#86A2FF;--penbg:#1C2742;--hl:rgba(255,216,77,.30);
  --danger:#FF7A63;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
html{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.5px);
  background-size:22px 22px;color:var(--ink);font:16px/1.4 var(--sans);min-height:100dvh;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer}
h2,h3{margin:0}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#view{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px calc(var(--nav) + env(safe-area-inset-bottom) + 28px)}
body.has-composer #view{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 132px)}

/* header */
.dayhead{display:flex;align-items:center;gap:4px;margin:6px 0 10px}
.dayhead .t{flex:1;text-align:center}
.dow{color:var(--soft);font-size:14px}
.date{font:600 30px/1.1 var(--serif);letter-spacing:-.01em}
.ib{width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;flex:none}
.ib:active{background:var(--penbg)}
.phead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}
.phead h2{font:600 30px/1.1 var(--serif);letter-spacing:-.01em}
.sub{color:var(--soft);font-size:14px}
.chiplink{display:inline-block;border:0;background:var(--penbg);color:var(--pen);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;margin:0 auto 8px}
.center{text-align:center}
.prog{color:var(--soft);font-size:14px;text-align:center;margin:-4px 0 14px}

/* entries */
.list{margin:6px 0 0}
.row{display:flex;align-items:center;min-height:46px}
.bul{width:44px;height:44px;flex:none;border:0;background:none;color:var(--ink);display:grid;place-items:center;border-radius:50%}
.bul:active{background:var(--penbg)}
.txt{flex:1;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:10px 4px;min-width:0;overflow-wrap:anywhere}
.txt.prio span{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.row.done .txt,.row.drop .txt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.row.dim .txt{color:var(--faint)}
.row.dim .bul{color:var(--faint)}
.tm{font-size:13px;color:var(--soft);padding:0 6px;white-space:nowrap}
.empty{text-align:center;color:var(--soft);padding:34px 12px}
.empty b{display:block;color:var(--ink);font:600 20px var(--serif);margin-bottom:6px}

.banner{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 14px;
  box-shadow:var(--shadow);margin-bottom:12px;width:100%;border:0;border-left:5px solid var(--marker);text-align:left;color:inherit}
.banner b{display:block}
.banner .go{margin-left:auto;color:var(--pen);font-weight:600}
.glance{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface);border-radius:var(--r);padding:12px 14px;
  box-shadow:var(--shadow);margin-bottom:12px;text-align:left}
.glance .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.glance .bar i{display:block;height:100%;background:var(--pen);border-radius:4px}

/* composer */
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));padding:18px 12px 10px;
  background:linear-gradient(transparent,var(--paper) 30%);z-index:5}
.cbox{max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:8px 8px 8px 10px}
.types{display:flex;gap:6px;align-items:center;padding:2px 2px 6px;overflow-x:auto}
.chip{position:relative;display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:transparent;border-radius:999px;
  height:36px;padding:0 12px 0 6px;color:var(--soft);font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip svg{flex:none}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.clk{padding:0 12px 0 10px;gap:6px}
.chip.clk.on{background:var(--penbg);border-color:var(--pen);color:var(--pen)}
.chip input[type=time]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0}
.cline{display:flex;gap:8px;align-items:center}
.cline input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:10px 6px;outline:0}
.cline input::placeholder{color:var(--faint)}
.add{width:48px;height:48px;border-radius:50%;border:0;background:var(--marker);color:#14213D;display:grid;place-items:center;flex:none}
.add:active{transform:scale(.94)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:10}
.nav button{flex:1;border:0;background:none;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 11.5px var(--sans)}
.nav .ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on .ic{background:var(--marker);color:#14213D}

/* cards, rows, controls */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 14px;margin:0 0 14px}
.crow{display:flex;align-items:center;gap:10px;padding:10px 0;min-height:56px}
.crow+.crow{border-top:1px solid var(--line)}
.crow>div:first-child{flex:1;min-width:0}
.crow b{font-weight:600}
.sec{font:600 18px var(--serif);margin:20px 0 8px}
input[type=time],select,.field{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.field{width:100%;font-size:17px;margin:6px 0 10px}
.field:focus{border-color:var(--pen);outline:0}
input.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .15s;flex:none;margin:0}
input.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
input.sw:checked{background:var(--pen)}
input.sw:checked::after{transform:translateX(20px)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:16px;background:var(--penbg);color:var(--pen);margin:10px 0 0}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.danger,.danger{color:var(--danger)}
.btn.small{width:auto;padding:9px 16px;margin:0;font-size:14px}
.lbl{color:var(--soft);font-size:14px;margin:12px 0 6px}
.fl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;margin:6px 0 14px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:999px;color:var(--soft);font-weight:600}
.seg button.on{background:var(--marker);color:#14213D}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
#sheet .back{position:absolute;inset:0;background:rgba(10,16,28,.5);opacity:0;transition:opacity .18s}
#sheet.open .back{opacity:1}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin-inline:auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .2s ease;max-height:90dvh;overflow:auto}
#sheet.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.panel h3{font:600 22px var(--serif);margin-bottom:4px}
.acts{display:flex;flex-direction:column;margin-top:8px}
.acts button{border:0;background:none;text-align:left;padding:15px 4px;font-size:16px;border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.mrow .mt{flex:1;min-width:0;overflow-wrap:anywhere}
.mbtns{display:flex;gap:6px}
.mbtns button{border:0;border-radius:10px;background:var(--penbg);color:var(--pen);padding:9px 11px;font-weight:600;font-size:14px}
.mbtns button.danger{background:transparent}

/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-20px);opacity:0;transition:.2s;z-index:80;
  background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:var(--shadow);font-size:15px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast button{border:0;background:none;color:var(--marker);font-weight:700;padding:0}

/* month */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:6px}
.cal .wd{font-size:12px;color:var(--soft);padding:4px 0}
.day{aspect-ratio:1/1.05;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.day.today{box-shadow:inset 0 0 0 2px var(--pen);font-weight:700}
.day .dots{display:flex;gap:3px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--pen)}
.day .dots i.dn{background:var(--faint)}
.mtitle{flex:1;text-align:center;font:600 24px var(--serif)}
.tally{display:flex;gap:10px;margin:14px 0}
.tally div{flex:1;background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.tally b{display:block;font:600 26px var(--serif)}
.tally span{color:var(--soft);font-size:14px}
.later{display:flex;align-items:center;gap:6px;min-height:46px}
.later .txt{padding:8px 4px}
.later .btn{margin:0}

/* habits */
.habit{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 6px 12px 12px;margin-bottom:12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.hchk{width:50px;height:50px;border-radius:50%;border:2.5px solid var(--c);background:transparent;color:#fff;display:grid;place-items:center}
.hchk svg{opacity:0}
.hchk.on{background:var(--c)}
.hchk.on svg{opacity:1}
.hname{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.hmeta{color:var(--soft);font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hmeta span{display:inline-flex;align-items:center;gap:4px}
.strip{grid-column:1/-1;display:flex;justify-content:space-between;padding:10px 6px 0 0}
.sd{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--soft);font-weight:600;font-size:13px}
.sd.on{background:var(--c);border-color:var(--c);color:#fff}
.sd.off{opacity:.4;border-style:dashed}
.sd.now{border-color:var(--c);border-width:2px}
.scroll{overflow-x:auto;margin:0 -18px;padding:0 18px}
.hgrid{border-collapse:separate;border-spacing:0 5px}
.hgrid th{font:500 11px var(--sans);color:var(--soft);min-width:30px;text-align:center;padding:0}
.hgrid th.tod{color:var(--ink);font-weight:800}
.hgrid th.hn{position:sticky;left:0;z-index:1;background:var(--paper);text-align:left;font:600 13px var(--sans);color:var(--ink);padding-right:8px}
.hgrid th.hn span{display:block;width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hgrid th.hn i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.cell{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:transparent;margin:0 2px;padding:0}
.cell.on{background:var(--c);border-color:var(--c)}
.cell.off{opacity:.35;border-style:dashed}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.swt{width:40px;height:40px;border-radius:50%;border:0;background:var(--c);box-shadow:0 0 0 3px var(--surface),0 0 0 5px transparent}
.swt.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.days{display:flex;gap:6px;justify-content:space-between}
.dayb{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--soft);font-weight:600}
.dayb.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.quick button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:500}
</style>
</head>
<body>
<main id="view" aria-live="polite"></main>

<div id="composer" class="composer" hidden>
  <div class="cbox">
    <div class="types" id="ctypes"></div>
    <div class="cline">
      <input id="cin" type="text" autocomplete="off" enterkeyhint="done" maxlength="200" aria-label="New entry">
      <button class="add" data-a="cadd" aria-label="Add entry"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
</div>

<nav class="nav" id="nav" aria-label="Sections"></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="imp" accept="application/json" hidden>

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const mkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const addMonths=(k,n)=>{const[y,m]=k.split('-').map(Number);return mkey(new Date(y,m-1+n,1))};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const T=()=>ymd(new Date());
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const LET=['S','M','T','W','T','F','S'];
const ICS_DAY=['SU','MO','TU','WE','TH','FR','SA'];
const COLORS=['#1F4BD8','#0B8F82','#D9482B','#7D4BD0','#B7791F','#2F9A4F'];
const fmtTime=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
const monthName=k=>{const[y,m]=k.split('-').map(Number);return MON[m-1]+' '+y};
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const ic=(p,s=24,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  today:'<circle cx="5" cy="7" r="1.2"/><path d="M9 7h11"/><circle cx="5" cy="12" r="1.2"/><path d="M9 12h11"/><circle cx="5" cy="17" r="1.2"/><path d="M9 17h11"/>',
  month:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  habits:'<circle cx="12" cy="12" r="8"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>',
  future:'<path d="M4 12h14M13 6l6 6-6 6"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  left:'<path d="m14.5 6-6 6 6 6"/>',right:'<path d="m9.5 6 6 6-6 6"/>',
  check:'<path d="m6 12.5 4 4 8-9"/>',
  more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'
};
const TABS=[['today','Today'],['month','Month'],['habits','Habits'],['future','Future'],['remind','Reminders']];

/* ---------- data ---------- */
const KEY='dotlog.v1';
const defaults=()=>({entries:[],habits:[],reminders:[],fired:{},
  settings:{morning:{on:false,time:'08:00'},evening:{on:false,time:'21:00'},theme:'auto',weekStart:0}});
let D;
try{
  const raw=JSON.parse(localStorage.getItem(KEY)||'{}');
  D=Object.assign(defaults(),raw);
  const ds=defaults().settings;
  D.settings=Object.assign(ds,raw.settings||{});
  D.settings.morning=Object.assign(ds.morning,(raw.settings||{}).morning||{});
  D.settings.evening=Object.assign(ds.evening,(raw.settings||{}).evening||{});
}catch(e){D=defaults()}
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const LN=NATIVE?window.Capacitor.Plugins.LocalNotifications:null;
let saveT;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}if(NATIVE){clearTimeout(saveT);saveT=setTimeout(scheduleNative,500)}};
const find=id=>D.entries.find(e=>e.id===id);
const findH=id=>D.habits.find(h=>h.id===id);
const findR=id=>D.reminders.find(r=>r.id===id);
const weekOrder=()=>[0,1,2,3,4,5,6].map(i=>(i+D.settings.weekStart)%7);

const U={tab:'today',day:T(),lastT:T(),month:mkey(new Date()),hmonth:mkey(new Date()),hmode:'today',
  ctype:'task',ctime:'',ftype:'task',fdraft:'',fmonth:addMonths(mkey(new Date()),1),nudged:false,undo:null};

/* ---------- theme ---------- */
function applyTheme(){
  const t=D.settings.theme;
  const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  $('#tc').content=dark?'#0E131A':'#EEF2F4';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);

/* ---------- UI primitives ---------- */
let sheetTok=0;
function openSheet(html){
  sheetTok++;
  const s=$('#sheet');
  s.innerHTML=`<div class="back" data-a="close"></div><div class="panel" role="dialog" aria-modal="true">${html}</div>`;
  s.hidden=false;
  requestAnimationFrame(()=>s.classList.add('open'));
}
function closeSheet(){
  const s=$('#sheet');const t=++sheetTok;
  s.classList.remove('open');
  setTimeout(()=>{if(t===sheetTok){s.hidden=true;s.innerHTML=''}},200);
}
let toastT;
function toast(msg,act){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>${act?`<button data-a="${act.a}">${esc(act.label)}</button>`:''}`;
  t.hidden=false;requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastT);
  toastT=setTimeout(()=>{t.classList.remove('show');setTimeout(()=>{t.hidden=true},220)},act?5000:2600);
}
function bulletSVG(e){
  const s=e.status;let p;
  if(s==='migrated')p='<path d="M9 7l5 5-5 5"/>';
  else if(s==='scheduled')p='<path d="M15 7l-5 5 5 5"/>';
  else if(e.type==='note')p='<path d="M8 12h8"/>';
  else if(e.type==='event')p=s==='done'?'<circle cx="12" cy="12" r="5.5" fill="currentColor" stroke="none"/>':'<circle cx="12" cy="12" r="5"/>';
  else if(s==='done')p='<path d="M8 8l8 8M16 8l-8 8"/>';
  else p='<circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>';
  return ic(p,24,2);
}
const TYPE_LABEL={task:'Task',event:'Event',note:'Note'};
function chips(cur,act){
  return ['task','event','note'].map(t=>`<button class="chip ${cur===t?'on':''}" data-a="${act}" data-v="${t}" aria-pressed="${cur===t}">${bulletSVG({type:t,status:'open'}).replace('width="24" height="24"','width="22" height="22"')}${TYPE_LABEL[t]}</button>`).join('');
}
function relDay(d){
  const diff=Math.round((parse(T())-parse(d))/864e5);
  if(diff===1)return'Yesterday';
  if(diff<7)return DAYS[parse(d).getDay()];
  return`${diff} days ago`;
}
function dayPicker(sel){
  return`<div class="days">${weekOrder().map(d=>`<button type="button" class="dayb ${sel.includes(d)?'on':''}" data-a="dtog" data-d="${d}" aria-pressed="${sel.includes(d)}" aria-label="${DAYS[d]}">${LET[d]}</button>`).join('')}</div>`;
}
function daysSummary(days){
  if(days.length===7)return'Every day';
  if(days.length===5&&![0,6].some(d=>days.includes(d)))return'Weekdays';
  if(days.length===2&&days.includes(0)&&days.includes(6))return'Weekends';
  return weekOrder().filter(d=>days.includes(d)).map(d=>DAYS[d].slice(0,3)).join(', ');
}

/* ---------- habits logic ---------- */
const habitsFor=day=>{const dow=parse(day).getDay();return D.habits.filter(h=>h.days.includes(dow))};
function streak(h){
  let n=0;const t=T();
  for(let i=0;i<400;i++){
    const key=addDays(t,-i);
    if(!h.days.includes(parse(key).getDay()))continue;
    if(h.log[key])n++;
    else if(i===0)continue;
    else break;
  }
  return n;
}

/* ---------- views ---------- */
function stale(){
  const t=T();
  return D.entries.filter(e=>e.type==='task'&&e.status==='open'&&e.date&&e.date<t)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);
}
function rowHTML(e){
  const st=e.status;
  const cls=['row',st==='done'?'done':'',st==='dropped'?'drop':'',(st==='migrated'||st==='scheduled')?'dim':''].join(' ');
  const act=e.type==='task'?(st==='done'?'Mark not done':'Mark done'):e.type==='event'?'Toggle attended':'Note';
  return`<div class="${cls}"><button class="bul" data-a="bullet" data-id="${e.id}" aria-label="${act}">${bulletSVG(e)}</button>`+
    `<button class="txt ${e.priority?'prio':''}" data-a="edit" data-id="${e.id}"><span>${esc(e.text)}</span></button>`+
    `${e.time?`<span class="tm">${ic(I.clock,14,2)} ${fmtTime(e.time)}</span>`:''}</div>`;
}
function vToday(){
  const t=T(),day=U.day,d=parse(day);

  let h=`<div class="dayhead"><button class="ib" data-a="prev" aria-label="Previous day">${ic(I.left)}</button>`+
    `<div class="t"><div class="dow">${day===t?'Today, ':''}${DAYS[d.getDay()]}</div><h2 class="date">${d.getDate()} ${MON[d.getMonth()]}${yr}</h2></div>`+
    `<button class="ib" data-a="next" aria-label="Next day">${ic(I.right)}</button></div>`;
  if(day!==t)h+=`<div class="center"><button class="chiplink" data-a="gotoday">Back to today</button></div>`;
  const tasks=list.filter(e=>e.type==='task'&&(e.status==='open'||e.status==='done'));
  if(tasks.length)h+=`<div class="prog">${tasks.filter(e=>e.status==='done').length} of ${tasks.length} tasks done</div>`;
  const st=day===t?stale():[];

  const hs=habitsFor(day);

    const dn=hs.filter(x=>x.log[day]).length;
    h+=`<button class="glance" data-a="tab" data-v="habits"><div><b>Habits</b><div class="sub">${dn} of ${hs.length} done</div></div><div class="bar"><i style="width:${Math.round(dn/hs.length*100)}%"></i></div>${ic(I.right,20)}</button>`;
  }
  if(!list.length)h+=`<div class="empty"><b>A clean page</b>Add a task, an event or a note below.<br>Tap a bullet to check it off.</div>`;
  else h+=`<div class="list">${list.map(rowHTML).join('')}</div>`;
  return h;
}
function vMonth(){
  const[y,m]=U.month.split('-').map(Number);
  const first=new Date(y,m-1,1),n=new Date(y,m,0).getDate();
  const lead=(first.getDay()-D.settings.weekStart+7)%7,t=T();
  const cnt={};let doneN=0,openN=0;
  D.entries.forEach(e=>{
    if(!e.date||e.type==='note'||!(e.status==='open'||e.status==='done'))return;
    const c=cnt[e.date]=cnt[e.date]||{o:0,d:0};
    e.status==='open'?c.o++:c.d++;
    if(e.type==='task'&&e.date.slice(0,7)===U.month)e.status==='open'?openN++:doneN++;
  });
  let h=`<div class="dayhead"><button class="ib" data-a="mprev" aria-label="Previous month">${ic(I.left)}</button><div class="mtitle">${MON[m-1]} ${y}</div><button class="ib" data-a="mnext" aria-label="Next month">${ic(I.right)}</button></div>`;
  h+=`<div class="cal">${weekOrder().map(d=>`<div class="wd">${LET[d]}</div>`).join('')}`;
  for(let i=0;i<lead;i++)h+='<span></span>';
  for(let d=1;d<=n;d++){
    const key=`${U.month}-${pad(d)}`,c=cnt[key];
    const dots=c?[...Array(Math.min(3,c.o+c.d))].map((_,i)=>i<c.o?'<i></i>':'<i class="dn"></i>').join(''):'';
    h+=`<button class="day ${key===t?'today':''}" data-a="openday" data-d="${key}" aria-label="${d} ${MON[m-1]}">${d}<span class="dots">${dots}</span></button>`;
  }
  h+='</div>';
  h+=`<div class="tally"><div><b>${doneN}</b><span>tasks done</span></div><div><b>${openN}</b><span>still open</span></div></div>`;
  const cur=mkey(new Date());

  if(later.length){
    h+=`<h3 class="sec">From your Future log</h3>`+later.map(e=>`<div class="later"><span class="bul" style="pointer-events:none">${bulletSVG(e)}</span><button class="txt" data-a="edit" data-id="${e.id}"><span>${esc(e.text)}</span></button>${U.month===cur?`<button class="btn small" data-a="ftoday" data-id="${e.id}">Add to today</button>`:''}</div>`).join('');
  }
  return h;
}
function vFuture(){

    `<div class="lbl">Repeat on</div>${dayPicker(h.days)}`+
    `<div class="crow" style="margin-top:8px"><div><b>Remind me</b></div><input type="time" id="h-time" value="${h.time||'09:00'}" aria-label="Reminder time"><input type="checkbox" class="sw" id="h-rem" ${h.remind?'checked':''} aria-label="Remind me"></div>`+
    `<button class="btn primary" data-a="hsave" data-id="${id||''}">Save habit</button>`+
    (id?`<button class="btn ghost danger" data-a="hdel" data-id="${id}">Delete habit</button>`:''));
  if(!id)setTimeout(()=>{const n=$('#h-name');n&&n.focus()},260);
}
function sheetReminder(){
  openSheet(`<div class="grab"></div><h3>New reminder</h3>`+
    `<input id="r-label" class="field" placeholder="For example: Take vitamins" maxlength="60" aria-label="Reminder text">`+
    `<div class="lbl">Repeat on</div>${dayPicker([0,1,2,3,4,5,6])}`+
    `<div class="crow" style="margin-top:8px"><div><b>Time</b></div><input type="time" id="r-time" value="09:00"></div>`+
    `<button class="btn primary" data-a="rsave">Save reminder</button>`);
  setTimeout(()=>{const n=$('#r-label');n&&n.focus()},260);
}
const pickedDays=()=>$$('#sheet .dayb.on').map(b=>+b.dataset.d);

/* ---------- notifications ---------- */
async function notify(title,body,tag){
  if('Notification' in window&&Notification.permission==='granted'){
    try{
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png',vibrate:[80,40,80]});return}
    }catch(e){}
    try{new Notification(title,{body,tag,icon:'icon-192.png'});return}catch(e){}
  }
  toast(`${title}: ${body}`);
}
function dueItems(now){
  const today=ymd(now),dow=now.getDay(),nowMin=now.getHours()*60+now.getMinutes(),out=[];
  const s=D.settings,openN=D.entries.filter(e=>e.date===today&&e.type==='task'&&e.status==='open').length;
  if(s.morning.on)out.push({key:`m-${today}`,at:s.morning.time,title:'Plan your day',body:openN?`${openN} open task${openN>1?'s':''} today.`:'Nothing logged yet. Take a minute to plan.'});
  if(s.evening.on)out.push({key:`v-${today}`,at:s.evening.time,title:'Evening review',body:'Review today and migrate what still matters.'});
  D.habits.forEach(h=>{if(h.remind&&h.time&&h.days.includes(dow)&&!h.log[today])out.push({key:`h-${h.id}-${today}-${h.time}`,at:h.time,title:h.name,body:'Time for your habit.',skip:()=>h.log[today]})});
  D.reminders.forEach(r=>{if(r.on&&r.days.includes(dow))out.push({key:`r-${r.id}-${today}-${r.time}`,at:r.time,title:r.label,body:'Your reminder.'})});
  D.entries.forEach(e=>{if(e.date===today&&e.time&&e.status==='open'&&e.type!=='note')out.push({key:`t-${e.id}-${today}-${e.time}`,at:e.time,title:e.text,body:e.type==='event'?'Event time.':'Task reminder.'})});
  return out.filter(x=>{const d=nowMin-toMin(x.at);return d>=0&&d<=180&&!D.fired[x.key]&&!(x.skip&&x.skip())});
}
function tick(){
  const t=T();
  if(t!==U.lastT){if(U.day===U.lastT)U.day=t;U.lastT=t;if(U.tab==='today'||U.tab==='habits')render()}
  if(NATIVE)return;
  const items=dueItems(new Date());
  if(!items.length)return;
  items.forEach(x=>{D.fired[x.key]=Date.now();notify(x.title,x.body,x.key)});
  const cut=Date.now()-4*864e5;
  Object.keys(D.fired).forEach(k=>{if(D.fired[k]<cut)delete D.fired[k]});
  save();
}

/* ---------- calendar export ---------- */
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function exportICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dotlog//EN','CALSCALE:GREGORIAN'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const today=T();let n=0;
  const ev=(id,title,date,time,days)=>{
    const[hh,mm]=time.split(':').map(Number);
    const rule=days?(days.length===7?'FREQ=DAILY':'FREQ=WEEKLY;BYDAY='+days.map(d=>ICS_DAY[d]).join(',')):'';
    L.push('BEGIN:VEVENT',`UID:${id}@dotlog`,`DTSTAMP:${stamp}`,`DTSTART:${date.replace(/-/g,'')}T${pad(hh)}${pad(mm)}00`,'DURATION:PT10M');
    if(rule)L.push('RRULE:'+rule);
    L.push(`SUMMARY:${icsEsc(title)}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(title)}`,'TRIGGER:PT0M','END:VALARM','END:VEVENT');
    n++;
  };
  const all=[0,1,2,3,4,5,6];
  if(D.settings.morning.on)ev('morning','Plan your day',today,D.settings.morning.time,all);
  if(D.settings.evening.on)ev('evening','Evening review',today,D.settings.evening.time,all);
  D.habits.forEach(h=>{if(h.remind&&h.time)ev('habit-'+h.id,h.name,today,h.time,h.days)});
  D.reminders.forEach(r=>{if(r.on)ev('rem-'+r.id,r.label,today,r.time,r.days)});
  D.entries.forEach(e=>{if(e.date&&e.date>=today&&e.time&&e.status==='open'&&e.type!=='note')ev('entry-'+e.id,e.text,e.date,e.time,null)});
  L.push('END:VCALENDAR');
  if(!n){toast('Turn on a reminder first, then export.');return}
  download(new Blob([L.join('\r\n')],{type:'text/calendar'}),'dotlog-reminders.ics');
  toast(`Exported ${n} reminder${n>1?'s':''}. Open the file to add them.`);
}
function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------- actions ---------- */
const A={
  tab(el){U.tab=el.dataset.v;window.scrollTo(0,0);render()},
  prev(){U.day=addDays(U.day,-1);render()},
  next(){U.day=addDays(U.day,1);render()},
  gotoday(){U.day=T();render()},
  ctype(el){U.ctype=el.dataset.v;syncComposer()},
  cclear(){U.ctime='';syncComposer()},
  cadd:addEntry,
  bullet(el){
    const e=find(el.dataset.id);if(!e)return;
    if(e.status!=='open'&&e.status!=='done')return;
    if(e.type==='note')return;
    e.status=e.status==='done'?'open':'done';
    save();render();
  },
  edit(el){sheetEntry(el.dataset.id)},
  esave(el){
    const e=find(el.dataset.id),txt=$('#e-text').value.trim();
    if(!txt){toast('Entry cannot be empty.');return}
    e.text=txt;e.priority=$('#e-prio').checked;
    const tm=$('#e-time');if(tm){e.time=tm.value;if(e.time)nudge()}
    save();closeSheet();render();tick();
  },
  etomorrow(el){migrate(el.dataset.id,addDays(find(el.dataset.id).date>T()?find(el.dataset.id).date:T(),1));save();closeSheet();render();toast('Moved to tomorrow.')},
  efuture(el){sheetFuturePick(el.dataset.id)},
  tofuture(el){toFuture(el.dataset.id,el.dataset.m);save();closeSheet();render();toast(`Sent to ${monthName(el.dataset.m)}.`)},
  etoday(el){const e=find(el.dataset.id);e.date=T();delete e.month;e.status='open';save();closeSheet();render();toast('Added to today.')},
  edel(el){
    const i=D.entries.findIndex(e=>e.id===el.dataset.id);if(i<0)return;
    U.undo={entry:D.entries[i],index:i};D.entries.splice(i,1);
    save();closeSheet();render();toast('Entry deleted.',{a:'undo',label:'Undo'});
  },
  undo(){if(!U.undo)return;D.entries.splice(Math.min(U.undo.index,D.entries.length),0,U.undo.entry);U.undo=null;save();render();$('#toast').classList.remove('show')},
  migrate:sheetMigrate,
  mtoday(el){migrate(el.dataset.id,T());save();sheetMigrate();render()},
  mfuture(el){const k=addMonths(mkey(new Date()),1);toFuture(el.dataset.id,k);save();sheetMigrate();render();toast(`Sent to ${monthName(k)}.`)},
  mdrop(el){const e=find(el.dataset.id);if(e)e.status='dropped';save();sheetMigrate();render()},
  mall(){const t=T();stale().forEach(e=>migrate(e.id,t));save();closeSheet();render();toast('Moved to today.')},
  close:closeSheet,
  dtog(el){el.classList.toggle('on');el.setAttribute('aria-pressed',el.classList.contains('on'))},
  mprev(){U.month=addMonths(U.month,-1);render()},
  mnext(){U.month=addMonths(U.month,1);render()},
  openday(el){U.day=el.dataset.d;U.tab='today';window.scrollTo(0,0);render()},
  ftoday(el){const e=find(el.dataset.id);e.date=T();delete e.month;save();render();toast('Added to today.')},
  ftype(el){U.ftype=el.dataset.v;const f=$('#fin');if(f)U.fdraft=f.value;render()},
  fadd(){
    const f=$('#fin'),txt=f.value.trim();
    if(!txt){f.focus();return}
    D.entries.push({id:uid(),type:U.ftype,text:txt,date:null,month:$('#fmonth').value,status:'open',priority:false,time:'',created:Date.now()});
    U.fdraft='';save();render();toast('Added to Future log.');
  },
  hmode(el){U.hmode=el.dataset.v;render()},
  hprev(){U.hmonth=addMonths(U.hmonth,-1);render()},
  hnext(){U.hmonth=addMonths(U.hmonth,1);render()},
  hcheck(el){
    const h=findH(el.dataset.id),d=el.dataset.d;if(!h)return;
    if(h.log[d])delete h.log[d];else h.log[d]=true;
    save();
    if(el.dataset.grid){el.classList.toggle('on',!!h.log[d])}else render();
  },
  hnew(){sheetHabit('')},
  hedit(el){sheetHabit(el.dataset.id)},
  hquick(el){
    D.habits.push({id:uid(),name:el.dataset.n,color:COLORS[D.habits.length%COLORS.length],days:[0,1,2,3,4,5,6],time:'09:00',remind:false,log:{},created:Date.now()});
    save();render();
  },
  hcolor(el){$$('.swt').forEach(b=>b.classList.toggle('sel',b===el))},
  hsave(el){
    const name=$('#h-name').value.trim(),days=pickedDays();
    if(!name){toast('Give your habit a name.');return}
    if(!days.length){toast('Pick at least one day.');return}
    const sel=$('.swt.sel'),color=sel?sel.dataset.c:COLORS[0],time=$('#h-time').value||'09:00',remind=$('#h-rem').checked;
    const id=el.dataset.id;
    if(id)Object.assign(findH(id),{name,color,days,time,remind});
    else D.habits.push({id:uid(),name,color,days,time,remind,log:{},created:Date.now()});
    if(remind)nudge();
    save();closeSheet();render();tick();
  },
  hdel(el){
    if(!confirm('Delete this habit and its history?'))return;
    D.habits=D.habits.filter(h=>h.id!==el.dataset.id);save();closeSheet();render();
  },
  notif(){
    if(NATIVE){
      if(NPERM!=='granted'){requestNative();return}
      LN.schedule({notifications:[{id:1,title:'Dotlog',body:'This is how your reminders will look.',channelId:'dotlog',schedule:{at:new Date(Date.now()+2000)}}]}).catch(()=>{});
      toast('Test arriving in a moment.');return;
    }
    if(!('Notification' in window))return;
    if(Notification.permission==='granted'){notify('Dotlog','This is how your reminders will look.','test');return}
    Notification.requestPermission().then(()=>render());
  },
  rnew:sheetReminder,
  rsave(){
    const label=$('#r-label').value.trim(),days=pickedDays();
    if(!label){toast('Write what to be reminded of.');return}
    if(!days.length){toast('Pick at least one day.');return}
    D.reminders.push({id:uid(),label,days,time:$('#r-time').value||'09:00',on:true});
    nudge();save();closeSheet();render();tick();
  },
  rdel(el){D.reminders=D.reminders.filter(r=>r.id!==el.dataset.id);save();render()},
  ics:exportICS,
  export(){download(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),`dotlog-backup-${T()}.json`)},
  import(){$('#imp').click()}
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');
  if(el&&A[el.dataset.a])A[el.dataset.a](el);
});
document.addEventListener('change',ev=>{
  const el=ev.target,val=el.type==='checkbox'?el.checked:el.value;
  if(el.id==='ctm'){U.ctime=el.value;syncComposer();if(el.value)nudge()}
  else if(el.id==='fmonth'){U.fmonth=el.value}
  else if(el.id==='imp'){
    const f=el.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const j=JSON.parse(rd.result);
        if(!Array.isArray(j.entries)||!Array.isArray(j.habits))throw 0;
        D=Object.assign(defaults(),j);D.settings=Object.assign(defaults().settings,j.settings||{});
        save();applyTheme();render();toast('Backup restored.');
      }catch(e){toast('That file is not a Dotlog backup.')}
    };
    rd.readAsText(f);el.value='';
  }
  else if(el.dataset.k){
    const path=el.dataset.k.split('.');let o=D.settings;
    for(let i=0;i<path.length-1;i++)o=o[path[i]];
    o[path[path.length-1]]=el.dataset.num?Number(val):val;
    if(val===true)nudge();
    save();applyTheme();
    if(el.dataset.k==='theme'||el.dataset.k==='weekStart')render();
    tick();
  }
  else if(el.dataset.hid){const h=findH(el.dataset.hid);h[el.dataset.f]=val;if(val===true)nudge();save();tick()}
  else if(el.dataset.rid){const r=findR(el.dataset.rid);r[el.dataset.f]=val;if(val===true)nudge();save();tick()}
});
document.addEventListener('input',ev=>{if(ev.target.id==='fin')U.fdraft=ev.target.value});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;
  if(ev.target.id==='cin'){ev.preventDefault();addEntry()}
  else if(ev.target.id==='fin'){ev.preventDefault();A.fadd()}
  else if(ev.target.id==='e-text'){ev.preventDefault();const b=$('[data-a=esave]');b&&b.click()}
});
/* swipe between days */
let sx=0,sy=0;
$('#view').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('#view').addEventListener('touchend',e=>{
  if(U.tab!=='today')return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>80&&Math.abs(dy)<40){dx<0?A.next():A.prev()}
},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- native (Android app) scheduling ---------- */
let NPERM='prompt';
async function refreshNPerm(){try{const r=await LN.checkPermissions();NPERM=r.display}catch(e){}}
async function requestNative(){
  try{
    const r=await LN.requestPermissions();NPERM=r.display;
    if(NPERM==='granted')scheduleNative();
    if(U.tab==='remind')render();
  }catch(e){}
}
const hashId=s=>{let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%2000000000+1};
async function scheduleNative(){
  if(!NATIVE||NPERM!=='granted')return;
  try{
    const pend=await LN.getPending();
    if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const out=[],s=D.settings,all=[0,1,2,3,4,5,6];
    const rep=(key,title,body,time,days)=>{
      const[hh,mm]=time.split(':').map(Number);
      (days.length===7?[null]:days).forEach(d=>out.push({id:hashId(key+(d===null?'':'-'+d)),title,body,channelId:'dotlog',
        schedule:{on:Object.assign(d===null?{}:{weekday:d+1},{hour:hh,minute:mm}),allowWhileIdle:true}}));
    };
    if(s.morning.on)rep('morning','Plan your day','Open Dotlog and log what matters today.',s.morning.time,all);
    if(s.evening.on)rep('evening','Evening review','Review today and migrate what still matters.',s.evening.time,all);
    D.habits.forEach(h=>{if(h.remind&&h.time&&h.days.length)rep('h-'+h.id,h.name,'Time for your habit.',h.time,h.days)});
    D.reminders.forEach(r=>{if(r.on&&r.days.length)rep('r-'+r.id,r.label,'Your reminder.',r.time,r.days)});
    const now=Date.now(),limit=now+90*864e5;
    D.entries.forEach(e=>{
      if(!e.date||!e.time||e.status!=='open'||e.type==='note')return;
      const[y,m,d]=e.date.split('-').map(Number),[hh,mm]=e.time.split(':').map(Number);
      const at=new Date(y,m-1,d,hh,mm);
      if(at.getTime()>now&&at.getTime()<limit)out.push({id:hashId('t-'+e.id+'-'+e.time),title:e.text,body:e.type==='event'?'Event time.':'Task reminder.',channelId:'dotlog',schedule:{at,allowWhileIdle:true}});
    });
    if(out.length)await LN.schedule({notifications:out.slice(0,400)});
  }catch(e){}
}
async function initNative(){
  try{await LN.createChannel({id:'dotlog',name:'Dotlog reminders',description:'Tasks, habits and daily prompts',importance:4,visibility:1,vibration:true})}catch(e){}
  await refreshNPerm();
  scheduleNative();
  if(U.tab==='remind')render();
}

/* ---------- start ---------- */
if(NATIVE)initNative();
if(!NATIVE&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();render();tick();
setInterval(tick,20000);
})();
